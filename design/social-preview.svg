<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wishka social sharing preview</title>
  <desc id="desc">Paper Ledger branded preview for the Wishka wishlist service</desc>

  <rect width="1200" height="630" fill="#f3f0e9"/>
  <rect x="38" y="38" width="1124" height="554" fill="#faf8f2" stroke="#2b2820" stroke-width="2"/>

  <g fill="#2b2820">
    <rect x="78" y="78" width="70" height="70" fill="#f3f0e9" stroke="#2b2820" stroke-width="2"/>
    <text x="113" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="600">W</text>
    <text x="172" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">WISHLISTS · GIFTS · SURPRISES</text>
    <line x1="172" y1="126" x2="623" y2="126" stroke="#cfc7b3" stroke-width="1"/>

    <text x="78" y="267" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="600" letter-spacing="-2">Wishka</text>
    <text x="82" y="329" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600">Вишлист, которым</text>
    <text x="82" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600">приятно делиться.</text>
    <text x="83" y="419" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5f594a">A wishlist made for sharing.</text>
  </g>

  <g transform="translate(700 78)">
    <rect width="402" height="474" fill="#f5f2ea" stroke="#cfc7b3" stroke-width="1"/>
    <text x="24" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#5f594a">HOW A WISH BECOMES A SURPRISE</text>
    <line x1="24" y1="53" x2="378" y2="53" stroke="#2b2820" stroke-width="2"/>

    <g transform="translate(24 78)">
      <rect width="354" height="98" fill="#faf8f2" stroke="#cfc7b3"/>
      <text x="18" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.8" fill="#3c5a4a">01 · ADD A WISH</text>
      <text x="18" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" fill="#2b2820">Paste a product link</text>
      <text x="18" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5f594a">The card assembles itself.</text>
      <rect x="298" y="20" width="36" height="36" fill="#e7ede9" stroke="#3c5a4a"/>
      <path d="M307 38h18M316 29v18" stroke="#3c5a4a" stroke-width="2"/>
    </g>

    <g transform="translate(24 192)">
      <rect width="354" height="98" fill="#faf8f2" stroke="#cfc7b3"/>
      <text x="18" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.8" fill="#3c5a4a">02 · SHARE THE LIST</text>
      <text x="18" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" fill="#2b2820">Send it to your people</text>
      <text x="18" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5f594a">Everyone knows what is taken.</text>
      <rect x="298" y="20" width="36" height="36" fill="#e7ede9" stroke="#3c5a4a"/>
      <circle cx="308" cy="38" r="3.5" fill="#3c5a4a"/>
      <circle cx="324" cy="29" r="3.5" fill="#3c5a4a"/>
      <circle cx="324" cy="47" r="3.5" fill="#3c5a4a"/>
      <path d="m311 36 10-5M311 40l10 5" stroke="#3c5a4a" stroke-width="2"/>
    </g>

    <g transform="translate(24 306)">
      <rect width="354" height="98" fill="#faf8f2" stroke="#cfc7b3"/>
      <text x="18" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.8" fill="#3c5a4a">03 · KEEP THE SURPRISE</text>
      <text x="18" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" fill="#2b2820">Reservations stay secret</text>
      <text x="18" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5f594a">The list owner never sees them.</text>
      <rect x="298" y="20" width="36" height="36" fill="#f6ecd2" stroke="#e2cf9e"/>
      <path d="M307 37h18v13h-18zM316 37v13M305 32h22v7h-22z" fill="none" stroke="#9a7415" stroke-width="2"/>
      <path d="M316 32c-7 0-8-9-2-9 3 0 4 4 2 9Zm0 0c7 0 8-9 2-9-3 0-4 4-2 9Z" fill="none" stroke="#9a7415" stroke-width="2"/>
    </g>

    <line x1="24" y1="431" x2="378" y2="431" stroke="#2b2820" stroke-width="1"/>
    <text x="24" y="455" font-family="'Courier New', monospace" font-size="12" letter-spacing="1.6" fill="#5f594a">WISHKA · OPEN SOURCE</text>
  </g>

  <line x1="78" y1="518" x2="623" y2="518" stroke="#2b2820" stroke-width="2"/>
  <text x="78" y="548" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#5f594a">PASTE → SHARE → KEEP THE SURPRISE</text>
</svg>
